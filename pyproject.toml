[project]
name = "faultbridge-intron"
version = "0.1.0"
description = "Code-switched voice agent for telco fault resolution and discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultbridge"]

[tool.ruff]
line-length = 88
target-version = "py311"
